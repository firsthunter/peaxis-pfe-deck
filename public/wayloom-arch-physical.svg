<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 470" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280" />
    </marker>
  </defs>
  <rect width="910" height="470" fill="white" />

  <!-- Users -->
  <rect x="40" y="30" width="200" height="60" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="140" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">Clinicians &amp; Patients</text>

  <rect x="670" y="30" width="200" height="60" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="770" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">Engineering Team</text>

  <!-- Web app -->
  <rect x="40" y="140" width="200" height="70" rx="12" fill="#E6FAF9" stroke="#00B8B3" stroke-width="1.5" />
  <text x="140" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">wayloom-web</text>
  <text x="140" y="186" text-anchor="middle" font-size="11" fill="#374151">Next.js · :3000</text>

  <!-- Execution visualizer -->
  <rect x="670" y="140" width="200" height="70" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="770" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">wayloom-execution</text>
  <text x="770" y="186" text-anchor="middle" font-size="11" fill="#374151">Astro · :4321</text>

  <!-- API -->
  <rect x="290" y="140" width="180" height="70" rx="12" fill="white" stroke="#001027" stroke-width="1.5" />
  <text x="380" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">wayloom-api</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#374151">NestJS · :3001</text>

  <!-- AI Service -->
  <rect x="490" y="140" width="180" height="70" rx="12" fill="#E6FAF9" stroke="#00B8B3" stroke-width="1.5" />
  <text x="580" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">wayloom-ai</text>
  <text x="580" y="186" text-anchor="middle" font-size="11" fill="#374151">FastAPI · :8000</text>

  <!-- Data layer -->
  <rect x="120" y="290" width="180" height="80" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="210" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">PostgreSQL</text>
  <text x="210" y="340" text-anchor="middle" font-size="11" fill="#374151">:54329 (Prisma)</text>

  <rect x="360" y="290" width="180" height="80" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="450" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">MongoDB</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#374151">Engine sessions</text>

  <rect x="600" y="290" width="180" height="80" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="690" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">Redis</text>
  <text x="690" y="340" text-anchor="middle" font-size="11" fill="#374151">:6379 shared cache</text>

  <!-- External providers -->
  <rect x="290" y="410" width="330" height="50" rx="12" fill="#FFFBEB" stroke="#FEC849" stroke-width="1.5" />
  <text x="455" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#001027">Gemini / Groq (external LLM providers)</text>

  <!-- Arrows -->
  <line x1="140" y1="90" x2="140" y2="140" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="770" y1="90" x2="770" y2="140" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="240" y1="175" x2="290" y2="175" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="470" y1="175" x2="490" y2="175" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="380" y1="210" x2="230" y2="290" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="580" y1="210" x2="450" y2="290" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="580" y1="210" x2="690" y2="290" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />
  <line x1="580" y1="210" x2="500" y2="410" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)" />

  <text x="455" y="20" text-anchor="middle" font-size="11" fill="#9CA3AF" font-style="italic">Base compose runs AI + Execution; dev overlay adds API + Web.</text>
</svg>
