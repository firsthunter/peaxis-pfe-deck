<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280" />
    </marker>
  </defs>
  <rect width="1060" height="460" fill="white" />

  <!-- Client layer -->
  <rect x="40" y="30" width="220" height="70" rx="12" fill="#E6FAF9" stroke="#00B8B3" stroke-width="1.5" />
  <text x="150" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#001027">Next.js Web</text>
  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#374151">Root / Institution / Clinician / Patient</text>

  <!-- Execution visualizer -->
  <rect x="800" y="30" width="220" height="70" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="910" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#001027">Execution Visualizer</text>
  <text x="910" y="76" text-anchor="middle" font-size="11" fill="#374151">Astro — sprint / task status</text>

  <!-- NestJS API -->
  <rect x="40" y="150" width="300" height="90" rx="12" fill="white" stroke="#001027" stroke-width="1.5" />
  <text x="190" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#001027">NestJS API</text>
  <text x="190" y="198" text-anchor="middle" font-size="11" fill="#374151">Institutions · Auth · Plans · Roles</text>
  <text x="190" y="214" text-anchor="middle" font-size="11" fill="#374151">Prisma + PostgreSQL</text>

  <!-- FastAPI AI Brain -->
  <rect x="380" y="150" width="300" height="90" rx="12" fill="#E6FAF9" stroke="#00B8B3" stroke-width="1.5" />
  <text x="530" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#001027">FastAPI AI Brain</text>
  <text x="530" y="198" text-anchor="middle" font-size="11" fill="#374151">LangGraph digitization pipeline</text>
  <text x="530" y="214" text-anchor="middle" font-size="11" fill="#374151">Ingest → Segment → Score → Adapt</text>

  <!-- Model Router -->
  <rect x="720" y="150" width="300" height="90" rx="12" fill="white" stroke="#001027" stroke-width="1.5" />
  <text x="870" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#001027">Model Router</text>
  <text x="870" y="198" text-anchor="middle" font-size="11" fill="#374151">Per-phase provider selection</text>
  <text x="870" y="214" text-anchor="middle" font-size="11" fill="#374151">Gemini · Groq</text>

  <!-- Data layer -->
  <rect x="40" y="320" width="220" height="90" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="150" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">PostgreSQL</text>
  <text x="150" y="370" text-anchor="middle" font-size="11" fill="#374151">Institutional + auth data</text>

  <rect x="300" y="320" width="220" height="90" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="410" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">MongoDB</text>
  <text x="410" y="370" text-anchor="middle" font-size="11" fill="#374151">Engine sessions + phase runs</text>

  <rect x="560" y="320" width="220" height="90" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="670" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">Redis</text>
  <text x="670" y="370" text-anchor="middle" font-size="11" fill="#374151">Deterministic phase cache</text>

  <rect x="820" y="320" width="200" height="90" rx="12" fill="#FFFBEB" stroke="#FEC849" stroke-width="1.5" />
  <text x="920" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#001027">Gemini / Groq</text>
  <text x="920" y="370" text-anchor="middle" font-size="11" fill="#374151">External LLM providers</text>

  <!-- Arrows -->
  <line x1="190" y1="100" x2="190" y2="150" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="260" y1="65" x2="380" y2="180" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="340" y1="195" x2="380" y2="195" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="680" y1="195" x2="720" y2="195" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="870" y1="240" x2="920" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="190" y1="240" x2="150" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="530" y1="240" x2="410" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="530" y1="240" x2="670" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="530" y="450" text-anchor="middle" font-size="11" fill="#9CA3AF" font-style="italic">Per-app CI validates all four applications independently.</text>
</svg>
